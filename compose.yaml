services:
  ssh-key-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssh-key-studio
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=2m
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SSH_STUDIO_HOST_BIND:-0.0.0.0}:${SSH_STUDIO_HOST_PORT:-7788}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
